[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-prop-model"
version = "0.1.0"
description = "NFL all-markets & player prop betting model with Streamlit UI"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1.0",
    "httpx>=0.27",
    "duckdb>=1.0",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15.0",
    "lightgbm>=4.3",
    "scipy>=1.12",
    "numpy>=1.26",
    "rapidfuzz>=3.6",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "streamlit>=1.35",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
nfl-odds = "src.ingestion.odds_client:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
